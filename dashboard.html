<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="logo/telecomscope-mark.svg">
<title>TelecomScope – concept prototype for Joyce Telecom Group</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#101C2C;--slate:#1E293B;--blue:#2563EB;--cyan:#06B6D4;--teal:#14B8A6;--bg:#F4F7FB;--card:#fff;--line:#E2E8F0;--tx:#0F172A;--mu:#64748B;--warn:#F59E0B;--bad:#DC2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1320;--card:#14202F;--line:#26364B;--tx:#E8EEF7;--mu:#93A3B8}}
:root[data-theme="dark"]{--bg:#0B1320;--card:#14202F;--line:#26364B;--tx:#E8EEF7;--mu:#93A3B8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--navy);color:#CBD5E1;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{color:#fff;font-weight:700;font-size:18px;padding:4px 10px 2px}.logo b{color:var(--cyan)}
.sub{font-size:12px;padding:0 10px 16px;color:#7C8DA6}
nav a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px;cursor:pointer}
nav a:hover{background:#1B2A40}nav a.on{background:var(--blue);color:#fff}
nav .soon{opacity:.45;cursor:default;font-size:13px}
main{padding:20px 26px 40px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:24px;margin:0;flex:1;min-width:220px;letter-spacing:-.01em}
select,input[type=search],input[type=text],button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.note{font-size:12px;color:var(--mu);margin:0 0 16px}
.grid{display:grid;gap:14px}.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px}
.kpi .n{font-size:28px;font-weight:700;letter-spacing:-.02em}.kpi .l{color:var(--mu);font-size:12px}.up{color:var(--teal);font-size:12px;font-weight:600}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px;cursor:pointer}
tr.r:hover{background:color-mix(in srgb,var(--blue) 8%,transparent);cursor:pointer}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--cyan) 18%,transparent)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.maprow{display:grid;grid-template-columns:1fr 250px;gap:14px}@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}nav .logo,nav .sub,nav .soon{display:none}.maprow{grid-template-columns:1fr}}
svg.map{width:100%;height:auto;border-radius:10px;background:#0F2236;display:block}
.layers label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.drawer{border-left:3px solid var(--cyan);padding-left:12px;margin-top:12px}.drawer dt{color:var(--mu);font-size:12px}.drawer dd{margin:0 0 6px}
.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lane{background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:10px;padding:8px;min-height:120px}.lane h4{margin:0 0 8px;font-size:12px;color:var(--mu)}
.opp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;font-size:13px}.opp small{color:var(--mu)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.sev-H{color:var(--bad)}.sev-M{color:var(--warn)}.sev-L{color:var(--teal)}
.dw{position:fixed;top:0;right:0;height:100%;width:min(390px,100%);background:var(--card);border-left:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 20px 22px;transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s;overflow:auto;z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.2)}.dw.on{transform:none;visibility:visible}.dw h3{margin:0 0 4px}.dw h4{margin:16px 0 6px}.dw ul{margin:0;padding-left:18px;color:var(--mu)}.x{float:right;font-size:20px;line-height:1;padding:2px 9px}textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;width:100%}.chat{display:grid;grid-template-columns:200px 1fr;gap:14px}@media(max-width:800px){.chat{grid-template-columns:1fr}}.sp{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:13px}#log{height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.msg{padding:10px 13px;border-radius:12px;max-width:92%;white-space:pre-wrap}.msg.u{align-self:flex-end;background:var(--blue);color:#fff}.msg.a{background:var(--bg);border:1px solid var(--line)}.act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.act button{font-size:12px;padding:4px 9px}.rep{background:#fff;color:#0F172A;border-radius:10px;padding:26px;border-top:6px solid var(--blue)}.rep h2{margin:0 0 4px;font-size:22px}.rep h4{margin:16px 0 4px;color:#1E40AF}.rep p{margin:0}.nt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.logo{display:flex;align-items:center;gap:9px;font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
.top h1,.kpi .n,.card h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
nav{background:linear-gradient(180deg,#101C2C,#0B1626)}nav a{transition:background .15s,color .15s}nav a.on{background:#1B2A40;color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.card{box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px -16px rgba(15,23,42,.25);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-1px)}main{max-width:1320px}
.tgl{margin:0 10px 12px;background:#1B2A40;border-color:#2D3F57;color:#CBD5E1;font-size:12px}
.pl{padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer}.pl.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:22px}.tli{position:relative;margin-bottom:12px}.tli::before{content:"";position:absolute;left:-30px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid var(--bg)}
.tli details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.tli summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lane.over{outline:2px dashed var(--cyan)}.opp[draggable=true]{cursor:grab}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:none}
.banner{background:color-mix(in srgb,var(--warn) 16%,transparent);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="app"><nav aria-label="Main">
<div class="logo"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#0B1626" stroke="#2D3F57" stroke-width="2"/><g fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"><path d="M20 30A14 14 0 0 1 34 44"/><path d="M20 20A24 24 0 0 1 44 44" opacity=".75"/><path d="M20 10A34 34 0 0 1 54 44" opacity=".5"/></g><circle cx="20" cy="44" r="5.5" fill="#14B8A6"/></svg><span>Telecom<b>Scope</b></span></div><div class="sub">Concept for Joyce Telecom Group</div><button class="tgl" onclick="tgl()" aria-label="Toggle light and dark theme">Switch theme</button>
<a data-v="overview">Executive overview</a><a data-v="map">Infrastructure map</a><a data-v="compete">Competitive landscape</a><a data-v="mdu">MDU opportunities</a><a data-v="dd">Due diligence</a><a data-v="ai">AI telecom analyst</a><a data-v="report">Report builder</a>
<div class="sub" style="padding-top:14px">Research and clients</div>
<a data-v="policy">Policy monitor</a><a data-v="clients">Client pipeline</a>
</nav><main id="m"></main></div><aside class="dw" id="dw" aria-label="Details"></aside><div class="toast" id="t"></div>
<script>
const $=s=>document.querySelector(s),toast=m=>{const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)};
const MK=['Harbor Bay','Ridgeline','Calder Valley','Northgate','Mill Creek'];
const PROV=[
['Lumen Ridge Fiber','Fiber Broadband','FTTH','Harbor Bay, Northgate','Residential, MDU','Challenger',34],
['Corvane Cable','Cable Broadband','DOCSIS 3.1','Harbor Bay, Calder Valley, Mill Creek','Residential','Incumbent',46],
['SkyReach Wireless','Fixed Wireless','5G FWA','Ridgeline, Calder Valley','Residential, Rural','Niche',12],
['Tidewater Business Net','Business Connectivity','Metro Ethernet','Harbor Bay, Northgate','Commercial','Specialist',18],
['Aldergate Enterprise','Enterprise Telecom','Dark fiber / DWDM','Harbor Bay','Enterprise, Government','Specialist',9]];
const ASSETS=[
['FB-1001','Harbor Trunk A','Fiber route','Harbor Bay','Lumen Ridge Fiber','FTTH','Operational','fiber',[[70,300],[160,250],[250,230],[340,190]]],
['FB-1002','Northgate Ring','Fiber route','Northgate','Tidewater Business Net','Metro Ethernet','Operational','fiber',[[340,190],[420,120],[520,90],[610,110]]],
['CB-2001','Valley Coax Spine','Cable route','Calder Valley','Corvane Cable','DOCSIS 3.1','Operational','cable',[[250,230],[330,320],[450,350],[560,330]]],
['TW-3001','Ridge Tower 1','Wireless tower','Ridgeline','SkyReach Wireless','5G FWA','Operational','tower',[[480,230]]],
['TW-3002','Calder Tower 2','Wireless tower','Calder Valley','SkyReach Wireless','5G FWA','Planned','tower',[[570,290]]],
['ND-4001','Harbor Node 7','Network node','Harbor Bay','Lumen Ridge Fiber','FTTH','Operational','node',[[160,250]]],
['PP-5001','Harbor POP','Point of presence','Harbor Bay','Aldergate Enterprise','DWDM','Operational','pop',[[250,230]]],
['DC-6001','Northgate Data Hall','Data center','Northgate','Aldergate Enterprise','DWDM','Under review','dc',[[420,120]]],
['MD-7001','Pier Court Apartments','MDU building','Harbor Bay','Corvane Cable','DOCSIS 3.1','Operational','mdu',[[110,285]]],
['MD-7002','Alder Heights','MDU building','Northgate','Unserved','None','Opportunity','mdu',[[520,90]]]];
const LAY={fiber:['Fiber routes','#06B6D4'],cable:['Cable routes','#F59E0B'],tower:['Wireless towers','#A78BFA'],node:['Network nodes','#14B8A6'],pop:['Points of presence','#2563EB'],dc:['Data centers','#F472B6'],mdu:['MDU buildings','#FACC15'],area:['Service areas','#64748B']};
const MDU=[['Pier Court Apartments',212,'Corvane Cable','Identified','Harbor Bay',72],['Alder Heights',148,'Unserved','Negotiation','Northgate',91],['Willow Row Lofts',96,'SkyReach Wireless','Researching','Ridgeline',64],['Kestrel Terrace',304,'Corvane Cable','Infrastructure Assessment','Calder Valley',80],['Marlow Court',58,'Unserved','Contact Initiated','Mill Creek',69],['Harborview Towers',420,'Lumen Ridge Fiber','Closed Won','Harbor Bay',88]];
const STAGES=['Identified','Researching','Infrastructure Assessment','Contact Initiated','Negotiation','Closed Won'];
const CHK=[['Fiber route as-builts received','Network Infrastructure',1,'M'],['Pole attachment agreements verified','Asset Ownership',0,'H'],['Capacity headroom at Harbor POP','Infrastructure Capacity',0,'M'],['Tower lease terms reviewed','Wireless Infrastructure',1,'L'],['Competitor overbuild check','Competitive Environment',0,'H']];
const RISK=[['R-01','Pole attachment rights unclear on Northgate Ring','Asset Ownership',4,5,'Request signed agreements'],['R-02','POP capacity near limit','Infrastructure Capacity',3,4,'Model growth scenarios'],['R-03','Documentation gaps on cable spine','Technical Documentation',3,2,'Commission field survey']];
const V={};
function counters(){document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,s=performance.now();(function f(n){const p=Math.min(1,(n-s)/700);e.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(f)})(s)})}
const spark=a=>{const m=Math.max(...a),pts=a.map((v,i)=>`${i*14},${24-v/m*22}`).join(' ');return`<svg width="84" height="26" aria-hidden="true"><polyline fill="none" stroke="#06B6D4" stroke-width="2" points="${pts}"/></svg>`};
const head=(t,s)=>`<div class="top"><h1>${t}</h1><select aria-label="Market"><option>All markets</option>${MK.map(m=>`<option>${m}</option>`).join('')}</select><button onclick="notif()" aria-label="Notifications">Alerts · 3</button></div><div class="banner">Simulated demonstration data. Nothing here is verified coverage, market share, or regulatory information.</div>`;
V.overview=()=>{const K=[['Markets monitored',24,'+2'],['Providers tracked',68,'+5'],['Infrastructure records',1280,'+64'],['MDU opportunities',156,'+12'],['Active projects',12,'+1'],['Opportunities identified',38,'+4']];
const bars=[['Fiber',38,'#06B6D4'],['Cable',31,'#F59E0B'],['Fixed wireless',17,'#A78BFA'],['Enterprise / other',14,'#2563EB']];
return`<div class="top"><h1>Good morning, Fred</h1><select aria-label="Period"><option>Last 12 months</option><option>Last quarter</option></select><button onclick="notif()" aria-label="Notifications">Alerts · 3</button></div><p class="note">Your telecommunications market intelligence at a glance. Concept prototype, fictional data.</p>
<div class="grid k6">${K.map((k,i)=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="n" data-n="${k[1]}">0</div><div class="up">${k[2]} this period</div>${spark([3,4,3,5,6,6,8+i%3].map(x=>x+i%2))}</div>`).join('')}</div>
<div class="grid c2" style="margin-top:14px"><div class="card"><h3>Network technology mix (simulated)</h3>${bars.map(b=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><span>${b[0]}</span><b>${b[1]}%</b></div><div class="bar"><i style="width:${b[1]*2}%;background:${b[2]}"></i></div></div>`).join('')}</div>
<div class="card"><h3>Markets ranked by opportunity score</h3><table style="min-width:0"><tr><th>Market</th><th>Providers</th><th>Competition</th><th>Score</th></tr>${[['Northgate',3,'Low',91],['Calder Valley',2,'Medium',78],['Ridgeline',1,'Low',74],['Mill Creek',2,'Medium',66],['Harbor Bay',5,'High',52]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><div class="bar"><i style="width:${r[3]}%"></i></div>${r[3]}</td></tr>`).join('')}</table></div></div>
<div class="grid c2" style="margin-top:14px"><div class="card"><h3>Market growth, last 12 months (simulated)</h3>${gc()}</div><div class="card"><h3>Recent activity</h3>${[['New market analysis completed','Northgate','2h ago'],['MDU opportunity added','Willow Row Lofts','5h ago'],['Infrastructure assessment updated','Harbor POP','Yesterday'],['Competitive profile revised','Corvane Cable','2 days ago'],['Consulting report generated','Calder Valley','3 days ago']].map(a=>`<div class="nt"><span style="color:var(--cyan)">●</span><span><b>${a[0]}</b><br><small style="color:var(--mu)">${a[1]} · ${a[2]}</small></span></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><h3>Insight</h3><p style="margin:0">In this sample dataset, Northgate pairs a high MDU opportunity score with low provider density. Open <a href="#map" style="color:var(--blue)">the infrastructure map</a> to see where the demo assets sit.</p></div>`};
V.map=()=>{let sel=null;const on=new Set(Object.keys(LAY));
const draw=()=>{const g=ASSETS.filter(a=>on.has(a[7])).map(a=>{const c=LAY[a[7]][1],p=a[8],hit=sel===a[0];
if(p.length>1)return`<polyline data-id="${a[0]}" points="${p.join(' ')}" fill="none" stroke="${c}" stroke-width="${hit?7:3.5}" stroke-linecap="round" stroke-dasharray="${a[7]=='cable'?'8 5':''}" style="cursor:pointer;transition:stroke-width .2s"/>`;
const[x,y]=p[0];return`<circle data-id="${a[0]}" cx="${x}" cy="${y}" r="${hit?11:7}" fill="${c}" stroke="#fff" stroke-width="1.5" style="cursor:pointer;transition:r .2s"/>`}).join('');
$('#mp').innerHTML=`<path d="M0 0H700V420H0Z" fill="#0F2236"/><path d="M0 330C80 350 110 300 170 310C240 322 300 270 360 250C430 230 470 280 540 270C610 260 650 200 700 190V420H0Z" fill="#0A1828"/><path d="M40 60C140 20 260 70 330 40C430 0 560 30 700 20V0H0Z" fill="#0A1828"/>${[['Harbor Bay',100,230],['Northgate',470,70],['Ridgeline',450,260],['Calder Valley',520,365],['Mill Creek',90,95]].map(m=>`<text x="${m[1]}" y="${m[2]}" fill="#6F86A3" font-size="13">${m[0]}</text>`).join('')}${on.has('area')?'<ellipse cx="190" cy="250" rx="130" ry="70" fill="#06B6D4" opacity=".12"/><ellipse cx="500" cy="110" rx="120" ry="60" fill="#2563EB" opacity=".14"/>':''}${g}`;
document.querySelectorAll('#mp [data-id]').forEach(e=>e.onclick=()=>{sel=e.dataset.id;draw();show()})};
const show=()=>{const a=ASSETS.find(x=>x[0]==sel);$('#dr').innerHTML=a?`<dl class="drawer"><dt>${a[0]}</dt><dd><b>${a[1]}</b></dd><dt>Type</dt><dd>${a[2]}</dd><dt>Provider</dt><dd>${a[4]}</dd><dt>Technology</dt><dd>${a[5]}</dd><dt>Status</dt><dd>${a[6]}</dd><dt>Location</dt><dd>${a[3]} (demo coordinates)</dd></dl>`:'<p class="note" style="margin-top:12px">Select a marker or route to see asset details.</p>'};
V.map.init=()=>{$('#lay').innerHTML=Object.entries(LAY).map(([k,v])=>`<label><input type="checkbox" checked data-k="${k}"><span style="width:10px;height:10px;border-radius:3px;background:${v[1]}"></span>${v[0]}</label>`).join('');
$('#lay').onchange=e=>{e.target.checked?on.add(e.target.dataset.k):on.delete(e.target.dataset.k);draw()};
$('#q').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#tb tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')};
document.querySelectorAll('#tb tr').forEach(r=>r.onclick=()=>{sel=r.dataset.id;draw();show();scrollTo({top:0,behavior:'smooth'})});draw();show()};
return`${head('Infrastructure map')}<div class="maprow"><div class="card"><svg class="map" viewBox="0 0 700 420" role="img" aria-label="Fictional demonstration network map"><g id="mp"></g></svg></div><div class="card"><h3>Layers</h3><div class="layers" id="lay"></div><div id="dr"></div></div></div>
<div class="card" style="margin-top:14px"><div class="top"><h3 style="margin:0;flex:1">Asset directory</h3><input type="search" id="q" placeholder="Search assets" aria-label="Search assets"></div><div class="scroll"><table><tr><th>ID</th><th>Name</th><th>Type</th><th>Location</th><th>Provider</th><th>Technology</th><th>Status</th></tr><tbody id="tb">${ASSETS.map(a=>`<tr class="r" data-id="${a[0]}"><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td><td>${a[4]}</td><td>${a[5]}</td><td><span class="tag">${a[6]}</span></td></tr>`).join('')}</tbody></table></div></div>`};
V.compete=()=>{V.compete.init=()=>{const draw=()=>{const f=$('#cat').value;$('#pt').innerHTML=PROV.filter(p=>f=='All'||p[1]==f).map(p=>`<tr class="r" data-i="${PROV.indexOf(p)}"><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td><span class="tag">${p[5]}</span></td><td><div class="bar"><i style="width:${p[6]*2}%"></i></div>${p[6]}%</td></tr>`).join('');document.querySelectorAll('#pt tr').forEach(r=>r.onclick=()=>provD(+r.dataset.i))};$('#cat').onchange=draw;draw()};
return`${head('Competitive landscape')}<div class="card"><div class="top"><h3 style="margin:0;flex:1">Provider directory (fictional providers)</h3><select id="cat" aria-label="Service category"><option>All</option>${[...new Set(PROV.map(p=>p[1]))].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="scroll"><table><tr><th>Provider</th><th>Category</th><th>Technology</th><th>Markets</th><th>Segments</th><th>Position</th><th>Presence (est.)</th></tr><tbody id="pt"></tbody></table></div></div>
<p class="note" style="margin-top:12px">Presence figures are invented placeholders, not market-share research.</p>`};
V.mdu=()=>{V.mdu.init=()=>{document.querySelectorAll('.opp').forEach(o=>o.onclick=()=>mduD(o.dataset.n));$('#add').onclick=()=>{const n=$('#nb').value.trim();if(!n)return toast('Enter a building name first');MDU.unshift([n,100,'Unknown','Identified','Harbor Bay',60]);$('#nb').value='';render()}};
const units=MDU.reduce((s,m)=>s+m[1],0);

<div style="margin-top:14px"><button class="p" onclick="location.hash='report'">Generate report preview</button></div>`};

const AIR={'Compare the providers in Harbor Bay':'Executive summary\nHarbor Bay is the most contested market in the demo set: 5 fictional providers across fiber, cable and enterprise.\n\nKey findings\n• Corvane Cable has the largest estimated presence (46%).\n• Lumen Ridge Fiber is the main fiber challenger (34%).\n• Only Aldergate Enterprise offers dark fiber.\n\nRisk\nHigh competition lowers the market score to 52.\n\nNext steps\nReview MDU buildings where cable is the only provider.','Find underserved areas':'Executive summary\nNorthgate scores highest (91) with low provider density in this sample.\n\nKey findings\n• Alder Heights (148 units) has no provider on record.\n• Ridgeline relies on a single fixed-wireless operator.\n\nOpportunity\nPackage Northgate and Ridgeline as one expansion study.\n\nNext steps\nValidate demand with site visits before relying on the score.','Identify MDU opportunities':'Executive summary\n6 demo buildings hold 1,238 units; 1 is closed, 1 is in negotiation.\n\nKey findings\n• Kestrel Terrace (304 units) is in infrastructure assessment.\n• Marlow Court has no provider and a score of 69.\n\nNext steps\nPrioritize Kestrel Terrace, then Alder Heights.','Summarize due diligence risks':'Executive summary\nThe Northgate Ring review has 3 open risks.\n\nKey findings\n• R-01 (score 20): pole attachment rights unclear.\n• R-02 (score 12): Harbor POP near capacity.\n\nNext steps\nRequest signed attachment agreements first.'};
V.ai=()=>{V.ai.init=()=>{const log=$('#log');const ask=q=>{if(!q.trim())return;log.insertAdjacentHTML('beforeend',`<div class="msg u"></div><div class="msg a"><span class="tx">…</span><div class="act"></div></div>`);log.children[log.children.length-2].textContent=q;const el=log.lastElementChild.querySelector('.tx'),act=log.lastElementChild.querySelector('.act'),t=AIR[q]||'This prototype only answers the suggested questions, using fictional data. Try one from the list.';let i=0;const h=setInterval(()=>{el.textContent=t.slice(0,i+=5);log.scrollTop=log.scrollHeight;if(i>=t.length){clearInterval(h);act.innerHTML='<button onclick="copyT(this)">Copy</button><button onclick="location.hash=\'map\'">View map</button><button onclick="toast(\'Analysis saved for this session\')">Save analysis</button>'}},16)};document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>ask(b.textContent));$('#go').onclick=()=>{ask($('#qi').value);$('#qi').value=''};$('#qi').onkeydown=e=>e.key=='Enter'&&$('#go').click()};
return`${head('AI telecom analyst')}<div class="chat"><div class="card"><h3>Suggested questions</h3>${Object.keys(AIR).map(k=>`<button class="sp">${k}</button>`).join('')}</div><div class="card"><div id="log"><div class="msg a">Ask about the demo markets. Answers are scripted from fictional data and are preliminary, not verified research. This is not a live AI model.</div></div><div class="top" style="margin:8px 0 0"><input type="text" id="qi" placeholder="Ask a question" aria-label="Question" style="flex:1"><button class="p" id="go">Send</button></div></div></div>`};
const SEC={'Executive summary':m=>`${m} is covered by several fictional providers. Preliminary view based on demo data only.`,'Competitive analysis':m=>'Cable has the largest estimated presence; fiber is the fastest-growing challenger.','Infrastructure overview':m=>`${ASSETS.length} demo assets recorded across fiber, cable, wireless and MDU layers.`,'Opportunities':m=>'Northgate and Ridgeline show low provider density; Alder Heights has no provider on record.','Risks':m=>'Pole attachment rights and POP capacity need review (R-01, R-02).','Recommendations':m=>'Validate demand on site, then commission a focused expansion study.'};
V.report=()=>{V.report.init=()=>{const upd=()=>{const mk=$('#rm').value,s=[...document.querySelectorAll('.rs:checked')].map(x=>x.value);$('#rp').innerHTML=`<h2>${$('#rt').value}</h2><p style="color:#64748B;font-size:12px">Prepared for Joyce Telecom Group · ${mk} · ${$('#rd').value} · simulated data</p>`+s.map(x=>`<h4>${x}</h4><p>${SEC[x](mk)}</p>`).join('')};document.querySelectorAll('#rb select,#rb input').forEach(e=>e.onchange=upd);$('#csv').onclick=()=>{const c=['Provider,Category,Technology,Markets,Position,Presence'].concat(PROV.map(p=>[p[0],p[1],p[2],'"'+p[3]+'"',p[5],p[6]].join(','))).join('\n');D(`<h3>Provider data (CSV)</h3><textarea id="cv" rows="12" readonly>${c}</textarea><button class="p" onclick="$('#cv').select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy')}">Copy CSV</button>`)};upd()};
return`${head('Report builder')}<div class="grid c2"><div class="card" id="rb"><h3>Build the report</h3><p><select id="rt"><option>Telecom Market Analysis</option><option>Competitive Landscape</option><option>MDU Opportunity Report</option><option>Due Diligence Report</option></select> <select id="rm">${MK.map(m=>`<option>${m}</option>`).join('')}</select> <select id="rd"><option>Last 12 months</option><option>Last quarter</option></select></p><h4>Sections</h4>${Object.keys(SEC).map(k=>`<label class="chk"><input type="checkbox" class="rs" value="${k}" checked>${k}</label>`).join('')}<p style="margin-top:14px"><button id="csv">Export provider CSV</button></p></div><div class="card"><div class="rep" id="rp"></div></div></div>`};
